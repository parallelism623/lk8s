apiVersion: v1
kind: LimitRange
metadata:
 name: example
spec:
  limits:
  - type: Pod
    min: 
      cpu: 200m
      memory: 6Mi
    max:
      cpu: 1
      memory: 100Mi
  - type: Container
    defaultRequest: 
      cpu: 100m 
      memory: 10Mi 
    default: 
      cpu: 200m 
      memory: 100Mi 
    min: 
      cpu: 50m 
      memory: 5Mi 
    max: 
      cpu: 1 
      memory: 1Gi 
    maxLimitRequestRatio: 
      cpu: 4 
      memory: 10
  - type: PersistentVolumeClaim
    defaultRequest:
      storage: 1Gi
    default:
      storage: 2Gi
    min:
      storage: 500Mi
    max:
      storage: 5Gi