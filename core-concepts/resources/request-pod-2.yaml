apiVersion: v1
kind: Pod
metadata:
  name: requests-pod-2
spec:
  restartPolicy: Never
  containers:
    - name: requests-pod-2
      image: busybox
      command:
        - dd
        - if=/dev/zero
        - of=/dev/null
      resources:
        requests:
          cpu: "3000m"
          memory: "20Mi"