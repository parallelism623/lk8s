apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kubia
spec:
  serviceName: kubia
  replicas: 2
  selector:
    matchLabels:
      app: kubia
  template:
    metadata:
      labels:
        app: kubia
    spec:
      imagePullSecrets:
      - name: anhhieu623-dockerhub-secret
      containers:
      - name: kubia
        image: anhhieu623/state-full-app:v1
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
          - name: data
            mountPath: /var/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: managed-csi-retain
      resources:
        requests:
          storage: 1Mi